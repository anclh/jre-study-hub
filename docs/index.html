<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6e4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="JRE Study Hub — 聯合招聘考試備試（中英）" />
  <title>JRE Study Hub · 主頁</title>
  <link rel="stylesheet" href="shell/tabbar.css?v=20261025j" />
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --ink: #1a2332;
      --muted: #5a6a7a;
      --border: #e2e8f0;
      --accent: #0b6e4f;
      --accent-soft: #e6f4ef;
      --accent-2: #1d4ed8;
      --shadow: 0 8px 24px rgba(26, 35, 50, 0.06);
      --radius: 14px;
      --font: "Segoe UI", "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, #d9f2e8 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #dce7ff 0%, transparent 50%),
        var(--bg);
      line-height: 1.55;
      min-height: 100vh;
      min-height: 100dvh;
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
      padding-bottom: calc(24px + var(--safe-bottom));
    }
    a { color: var(--accent-2); }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 8px 16px 0;
    }
    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 8px 0 20px;
    }
    .logo {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), #14967a);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: var(--shadow);
      font-size: 0.9rem;
    }
    .brand-text h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.2;
    }
    .brand-text p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    }
    .card:active {
      transform: scale(0.985);
      border-color: #b7e0d0;
      box-shadow: 0 4px 14px rgba(11, 110, 79, 0.12);
    }
    .card-ico {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 12px;
      background: var(--accent-soft);
      display: grid;
      place-items: center;
      font-size: 1.35rem;
      line-height: 1;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-body .zh {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
    }
    .card-body .en {
      margin: 3px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .chev {
      flex-shrink: 0;
      color: var(--accent);
      font-size: 1.25rem;
      font-weight: 600;
      opacity: 0.7;
    }
    .note {
      margin: 22px 4px 0;
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .note a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid #b7e0d0;
    }
  </style>
</head>
<body class="hub-has-tabs">
  <main class="wrap">
    <header class="brand">
      <div class="logo" aria-hidden="true">JRE</div>
      <div class="brand-text">
        <h1>JRE Study Hub</h1>
        <p>聯合招聘考試備試（中英）</p>
      </div>
    </header>

    <nav class="cards" aria-label="Study modules">
      <a class="card" href="policy/">
        <span class="card-ico" aria-hidden="true">🏛</span>
        <span class="card-body">
          <p class="zh">政策</p>
          <p class="en">時事／政策卡</p>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
      <a class="card" href="q1/">
        <span class="card-ico" aria-hidden="true">✍️</span>
        <span class="card-body">
          <p class="zh">英文 Q1</p>
          <p class="en">Data File／框架</p>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
      <a class="card" href="q2/">
        <span class="card-ico" aria-hidden="true">🖋</span>
        <span class="card-body">
          <p class="zh">中文 Q2</p>
          <p class="en">立場→理據→反駁→建議，計時寫作 + 政策題庫</p>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
      <a class="card" href="vocab/">
        <span class="card-ico" aria-hidden="true">📘</span>
        <span class="card-body">
          <p class="zh">詞彙</p>
          <p class="en">詞彙卡 · 翻卡學習</p>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
    </nav>

    <p class="note">
      Collocation Bank 另開：
      <a href="https://anclh.github.io/collocation-bank/" rel="noopener">anclh.github.io/collocation-bank</a>
    </p>
  </main>
  <script src="shell/tabbar.js?v=20261025j"></script>
</body>
</html>
