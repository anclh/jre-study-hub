<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6e4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="香港特區政府決策局架構、中英文名稱、職責及最新政策速查（JRE 備試專用）" />
  <title>政府決策局及最新政策 · JRE Study Hub</title>
  <link rel="stylesheet" href="../shell/study-theme.css?v=20261127type" />
  <link rel="stylesheet" href="../shell/tabbar.css?v=20261111" />
  <link rel="stylesheet" href="styles.css?v=20261123a" />
</head>
<body class="study-screen bureau-screen">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-text">
        <h1>香港特區政府決策局</h1>
        <p>15 個決策局的職責、近期措施，以及按現行中文 Q2 題庫整理的分工和閃卡</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="mode-switch" role="tablist" aria-label="查閱或閃卡">
      <button type="button" id="tab-browse" role="tab" aria-selected="true" aria-controls="browse-view">查閱</button>
      <button type="button" id="tab-flash" role="tab" aria-selected="false" aria-controls="flash-view">閃卡</button>
    </div>
    <div id="browse-view">

    <div class="search-box">
      <label for="search">搜尋議題或決策局</label>
      <input type="search" id="search" placeholder="例如：託兒、授權票、兩蚊兩折、LWB" />
    </div>


    <section class="issue-lookup" id="issue-lookup" aria-labelledby="issue-title">
      <h2 id="issue-title">按議題搵局</h2>
      <p id="q2-issue-status" role="status">正在核對中文 Q2 題庫…</p>
      <div class="issue-grid" id="q2-issues"></div>
    </section>

    <section class="issue-lookup" id="other-issue-lookup" aria-labelledby="other-issue-title" hidden>
      <h2 id="other-issue-title">其他政策議題及示範題</h2>
      <div class="issue-grid" id="other-issues"></div>
    </section>

    <p id="lookup-empty" role="status" hidden>找不到相符項目。試試簡短關鍵詞，例如「託兒」或「房屋」。</p>

    <div id="bureaux-list">
      <p class="bureau-state" id="bureau-loading">正在載入 15 個決策局…</p>
    </div>
    </div>

    <section id="flash-view" class="flash-view" hidden aria-labelledby="flash-title">
      <h2 id="flash-title">決策局閃卡</h2>
      <p class="flash-lede">練習辨認主責局、職責、近期措施及 Q2 議題分工。翻面查看分工、政策狀態及來源。進度只在這一次練習內，不會寫入瀏覽器儲存。</p>
      <div class="flash-controls">
        <label>局別
          <select id="flash-bureau" aria-label="按決策局篩選閃卡">
            <option value="all">全部 15 局</option>
          </select>
        </label>
        <button type="button" id="flash-shuffle">洗牌</button>
        <button type="button" id="flash-prev">上一張</button>
        <button type="button" id="flash-next">下一張</button>
        <p id="flash-progress" role="status">載入中…</p>
      </div>
      <p id="flash-state" class="bureau-state" role="status">正在載入閃卡…</p>
      <article id="flash-card" class="flash-card" tabindex="0" hidden aria-labelledby="flash-front">
        <p class="flash-kicker" id="flash-kicker"></p>
        <h3 id="flash-front"></h3>
        <p class="flash-en" id="flash-front-en"></p>
        <div id="flash-back" class="flash-back" hidden>
          <p><strong id="flash-back-title"></strong></p>
          <p class="flash-en" id="flash-back-en"></p>
          <ul id="flash-back-lines"></ul>
          <p id="flash-back-status"></p>
          <p id="flash-back-source" class="flash-sources" hidden></p>
        </div>
        <button type="button" id="flash-flip" aria-expanded="false" aria-controls="flash-back">翻面</button>
      </article>
    </section>
  </main>

  <script src="../shell/tabbar.js?v=20261109a"></script>
  <script src="app.js?v=20261127q2sync"></script>
</body>
</html>
